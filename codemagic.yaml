workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60

    environment:
      node: 20

    scripts:
      - npm install
      - npm run build
      - npx cap sync android
      - cd android && ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
